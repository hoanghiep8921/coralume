<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F4C5C"/>
      <stop offset="100%" stop-color="#1a6b7a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Ocean wave layers -->
  <path d="M0 350 Q150 320 300 350 Q450 380 600 350 L600 400 L0 400Z" fill="#0d4045" opacity="0.6"/>
  <path d="M0 370 Q150 340 300 365 Q450 390 600 360 L600 400 L0 400Z" fill="#0a3539" opacity="0.4"/>
  <!-- Single coral fragment -->
  <g transform="translate(300,220)" opacity="0.9">
    <ellipse cx="0" cy="50" rx="30" ry="45" fill="#E87750"/>
    <ellipse cx="0" cy="50" rx="22" ry="35" fill="#F4B89A"/>
    <circle cx="-8" cy="35" r="5" fill="#E87750" opacity="0.7"/>
    <circle cx="8" cy="40" r="4" fill="#E87750" opacity="0.7"/>
    <circle cx="-3" cy="25" r="3" fill="#E87750" opacity="0.5"/>
    <!-- Base -->
    <ellipse cx="0" cy="85" rx="35" ry="10" fill="#8B6914" opacity="0.5"/>
  </g>
  <!-- Light rays -->
  <g opacity="0.15">
    <line x1="200" y1="0" x2="300" y2="200" stroke="white" stroke-width="60"/>
    <line x1="350" y1="0" x2="300" y2="200" stroke="white" stroke-width="40"/>
    <line x1="400" y1="0" x2="350" y2="200" stroke="white" stroke-width="25"/>
  </g>
  <!-- Label -->
  <rect x="175" y="15" rx="20" ry="20" width="250" height="36" fill="rgba(15,76,92,0.7)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="300" y="39" text-anchor="middle" fill="#F4B89A" font-size="16" font-weight="600" font-family="system-ui, sans-serif">SEED CORAL · Standard</text>
  <!-- Small info -->
  <text x="300" y="340" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11" font-family="system-ui, sans-serif">San hô đơn lẻ · Nha Trang, Việt Nam</text>
</svg>
