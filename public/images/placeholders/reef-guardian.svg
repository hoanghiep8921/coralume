<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F4C5C"/>
      <stop offset="100%" stop-color="#156678"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5BA8B5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5BA8B5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#glow)"/>
  <!-- Ocean wave layers -->
  <path d="M0 330 Q100 310 200 330 Q300 350 400 325 Q500 300 600 320 L600 400 L0 400Z" fill="#0d4045" opacity="0.6"/>
  <path d="M0 355 Q150 340 250 355 Q380 370 500 345 L600 355 L600 400 L0 400Z" fill="#0a3539" opacity="0.4"/>
  <!-- Coral colony -->
  <g transform="translate(300,200)" opacity="0.9">
    <!-- Coral 1 (center, tallest) -->
    <ellipse cx="0" cy="60" rx="28" ry="50" fill="#E87750"/>
    <ellipse cx="0" cy="60" rx="20" ry="38" fill="#F4B89A"/>
    <circle cx="-6" cy="40" r="5" fill="#E87750" opacity="0.7"/>
    <circle cx="7" cy="35" r="4" fill="#E87750" opacity="0.7"/>
    <circle cx="0" cy="25" r="3" fill="#E87750" opacity="0.5"/>
    <!-- Coral 2 (left) -->
    <ellipse cx="-45" cy="50" rx="22" ry="40" fill="#D9776A"/>
    <ellipse cx="-45" cy="50" rx="16" ry="30" fill="#E89080"/>
    <circle cx="-50" cy="35" r="4" fill="#D9776A" opacity="0.7"/>
    <circle cx="-40" cy="30" r="3" fill="#D9776A" opacity="0.5"/>
    <!-- Coral 3 (right) -->
    <ellipse cx="45" cy="55" rx="20" ry="38" fill="#E87750"/>
    <ellipse cx="45" cy="55" rx="14" ry="28" fill="#F4B89A"/>
    <circle cx="42" cy="40" r="3.5" fill="#E87750" opacity="0.7"/>
    <!-- Marine life -->
    <g transform="translate(-70,-30)" opacity="0.6">
      <ellipse cx="0" cy="0" rx="8" ry="5" fill="#5BA8B5"/>
      <polygon points="12,0 20,-5 20,5" fill="#5BA8B5"/>
      <circle cx="-4" cy="-1" r="1.5" fill="white"/>
    </g>
    <g transform="translate(75,-20)" opacity="0.5">
      <ellipse cx="0" cy="0" rx="6" ry="4" fill="#F4B89A"/>
      <polygon points="8,0 14,-4 14,4" fill="#F4B89A"/>
      <circle cx="-3" cy="-1" r="1" fill="white"/>
    </g>
    <!-- Base/reef -->
    <ellipse cx="0" cy="90" rx="60" ry="12" fill="#8B6914" opacity="0.4"/>
    <ellipse cx="-45" cy="82" rx="30" ry="6" fill="#8B6914" opacity="0.3"/>
    <ellipse cx="45" cy="85" rx="25" ry="5" fill="#8B6914" opacity="0.3"/>
  </g>
  <!-- Light rays -->
  <g opacity="0.12">
    <line x1="150" y1="0" x2="250" y2="220" stroke="white" stroke-width="80"/>
    <line x1="300" y1="0" x2="300" y2="220" stroke="white" stroke-width="50"/>
    <line x1="450" y1="0" x2="350" y2="220" stroke="white" stroke-width="30"/>
  </g>
  <!-- Featured badge border glow -->
  <rect x="15" y="15" rx="24" ry="24" width="570" height="370" fill="none" stroke="#E87750" stroke-width="3" opacity="0.4"/>
  <!-- Label -->
  <rect x="150" y="15" rx="20" ry="20" width="300" height="36" fill="rgba(15,76,92,0.7)" stroke="#E87750" stroke-width="1.5"/>
  <text x="300" y="39" text-anchor="middle" fill="#F4B89A" font-size="16" font-weight="700" font-family="system-ui, sans-serif">REEF GUARDIAN · Premium</text>
  <text x="300" y="340" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11" font-family="system-ui, sans-serif">Quần thể san hô · AI Monitoring · Nha Trang</text>
</svg>
