<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F4C5C"/>
      <stop offset="100%" stop-color="#1a7b8a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Ocean wave layers -->
  <path d="M0 300 Q120 285 250 300 Q380 315 500 295 L600 300 L600 400 L0 400Z" fill="#0d4045" opacity="0.5"/>
  <path d="M0 330 Q150 320 300 330 Q450 340 600 320 L600 400 L0 400Z" fill="#0a3539" opacity="0.3"/>
  <!-- Diver silhouette -->
  <g transform="translate(280,180)" opacity="0.9">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="18" ry="35" fill="#1a3a4a"/>
    <!-- Head -->
    <circle cx="0" cy="-45" r="16" fill="#1a3a4a"/>
    <!-- Mask -->
    <ellipse cx="0" cy="-45" rx="14" ry="10" fill="none" stroke="#5BA8B5" stroke-width="2"/>
    <rect x="-8" y="-48" width="16" height="6" rx="2" fill="#5BA8B5" opacity="0.8"/>
    <!-- Tank -->
    <rect x="-14" y="-20" width="12" height="30" rx="5" fill="#2a5a6a"/>
    <!-- Arms -->
    <path d="M-18,-10 Q-45,-20 -55,0" stroke="#1a3a4a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M18,-10 Q40,0 35,20" stroke="#1a3a4a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Legs/fins -->
    <ellipse cx="-10" cy="30" rx="12" ry="18" fill="#2a5a6a"/>
    <ellipse cx="10" cy="30" rx="12" ry="18" fill="#2a5a6a"/>
    <!-- Bubbles -->
    <circle cx="15" cy="-55" r="3" fill="none" stroke="white" stroke-width="0.8" opacity="0.5"/>
    <circle cx="22" cy="-70" r="4" fill="none" stroke="white" stroke-width="0.8" opacity="0.4"/>
    <circle cx="18" cy="-85" r="2" fill="none" stroke="white" stroke-width="0.8" opacity="0.3"/>
  </g>
  <!-- Coral being planted -->
  <g transform="translate(455,190)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="16" ry="25" fill="#E87750"/>
    <ellipse cx="0" cy="0" rx="11" ry="18" fill="#F4B89A"/>
    <circle cx="-3" cy="-10" r="3" fill="#E87750" opacity="0.7"/>
    <!-- Hands reaching toward coral -->
  </g>
  <!-- Light rays -->
  <g opacity="0.12">
    <line x1="180" y1="0" x2="300" y2="220" stroke="white" stroke-width="70"/>
    <line x1="350" y1="0" x2="330" y2="220" stroke="white" stroke-width="40"/>
  </g>
  <!-- Label -->
  <rect x="150" y="15" rx="20" ry="20" width="300" height="36" fill="rgba(15,76,92,0.7)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="300" y="39" text-anchor="middle" fill="#F4B89A" font-size="16" font-weight="600" font-family="system-ui, sans-serif">DIVING EXPERIENCE · Premium+</text>
  <!-- Small info -->
  <text x="300" y="340" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11" font-family="system-ui, sans-serif">Trải nghiệm lặn thực tế · Tự tay trồng san hô</text>
</svg>
